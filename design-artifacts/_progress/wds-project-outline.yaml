# WDS Project Outline
# Generated by Phase 0: Project Setup
# Do not hand-edit outside of Phase 0 / Phase 8 workflows — this is the source of truth for project configuration.

project_name: "University AI Compute Management Platform"
project_type: greenfield
created: 2026-08-31

# Product Configuration
product_complexity: complex      # A=simple B=standard C=complex D=complex+mobile (chosen: C - Web Application)
tech_stack: null                 # skipped at setup, decide later
component_library: custom        # A=shadcn B=tailwind C=material D=custom E=skip (chosen: D)
skip_design_system: false        # custom library -> Phase 7 (D-Design-System) recommended, not skipped

# Structure
root_folder: design-artifacts    # overrides original pick of "design-process" - matches existing
                                  # _bmad/wds/config.yaml design_artifacts path and pre-scaffolded
                                  # A-E folders already present in the repo

# Existing Materials
existing_materials:
  has_materials: true
  items:
    - name: "SPEC-1"
      type: "formal specification document"
    - name: "Student Project Brief"
      type: "brief document"
  summary: >
    System evaluates requests immediately with deterministic outcomes restricted to four
    exact statuses: Accepted, Denied: Not Authorized, Denied: Resource Unavailable,
    Denied: Reservation Conflict. No queuing, holding, or automatic retries in this
    iteration. Manages heterogeneous local GPU fleet (mostly 24GB VRAM machines plus one
    dual 48GB GPU machine) over Kubernetes (device plugins + Kubeflow Training Operator).
    Access control governed by academic context (course, group, privilege level) and
    time-window restrictions for heavy workload types (e.g. training jobs). Scheduled
    academic class reservations take full precedence over conflicting general-use requests.
    System monitors/reports usage at token level (prompt/generation tokens) and tracks
    infrastructure status (available, reserved, busy, idle, failing).
    Full detail lives in A-Product-Brief/00-product-brief.md and the source SPEC-1 /
    Student Project Brief documents themselves.

# Brief & Analysis Depth
brief_level: complete            # greenfield always uses complete brief
strategic_analysis: full         # A=full (chosen) -> Phase 2 (Trigger Mapping) enabled

# Working Relationship / Project Context
project_context:
  stakes: departmental           # C - Departmental/Organizational -> comprehensive justification, evidence-based
  involvement: balanced          # B - Balanced
  role: product_owner            # B - Product Owner
  recommendation_style: recommend_with_rationale  # B - Recommend with rationale

stakeholders:
  - name: "Academic Administration"
    needs: "Fair, policy-aligned governance and auditability, no financial chargebacks/billing"
  - name: "Teachers"
    needs: "Absolute guarantee scheduled class GPU capacity is protected from general use"
  - name: "Students"
    needs: "Transparency, clear denial reasons (rule / quota / unavailability / reservation conflict)"
  - name: "Lab Operators"
    needs: "Real-time operational visibility into machine health, occupancy, failures"
  - name: "Privileged Users / Researchers"
    needs: "Controlled permission paths for high-VRAM and distributed-training jobs"

political_sensitivities:
  - "GPU resource scarcity"
  - "Friction between ad-hoc student access and strict class reservation windows"
  - "Eliminating current informal/manual coordination"

# Routing
next_phase: phase_1_project_brief   # greenfield + strategic_analysis=full -> Phase 1, then Phase 2
